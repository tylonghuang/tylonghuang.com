<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
  <main class="page{{ if .IsHome }} page--hero{{ end }}">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="imprint">
    {{/* imprint / legal line — content TBD */}}
  </footer>
  <script>
    (function () {
      var last = document.querySelector('.crane #creases');
      if (last) {
        last.addEventListener('animationend', function () {
          try { sessionStorage.setItem('craneDrawn', '1'); } catch (e) {}
          document.documentElement.classList.add('crane-drawn');
        }, { once: true });
      }

      var toggle = function (btn) {
        var panel = document.getElementById(btn.getAttribute('aria-controls'));
        if (!panel) return;
        var open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!open));
        panel.hidden = open;
      };
      document.querySelectorAll('.dragon').forEach(function (btn) {
        btn.addEventListener('click', function () { toggle(btn); });
        btn.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle(btn);
          }
        });
      });
    })();
  </script>
</body>
</html>
