{{ define "main" }}
<section class="posts">
  <h1 class="posts__title">{{ .Title | default "Writing" }}</h1>
  <ul class="posts__list" role="list">
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}
